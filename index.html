<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DealFinder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header span {
      color: #22c55e;
    }

    .hero {
      max-width: 1100px;
      margin: 25px auto;
      padding: 40px 25px;
      border-radius: 20px;
      color: white;
      background: linear-gradient(135deg, #111827, #2563eb);
    }

    .hero h2 {
      font-size: 42px;
      margin: 0 0 10px;
    }

    .hero p {
      font-size: 18px;
      line-height: 1.5;
    }

    .search-box {
      max-width: 1100px;
      margin: 20px auto;
      padding: 18px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px #0001;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 10px;
    }

    input,
    select,
    button {
      padding: 13px;
      border-radius: 9px;
      font-size: 16px;
    }

    input,
    select {
      border: 1px solid #ccd2dc;
      background: white;
    }

    button {
      cursor: pointer;
    }

    .search-button {
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    .source-buttons {
      max-width: 1100px;
      margin: 20px auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .source-button {
      border: none;
      color: white;
      font-weight: bold;
      min-height: 60px;
      font-size: 17px;
    }

    .trade-button {
      background: #e53935;
    }

    .facebook-button {
      background: #1877f2;
    }

    .results {
      max-width: 1100px;
      margin: 30px auto;
    }

    .results h2 {
      margin-bottom: 15px;
    }

    .status {
      margin-bottom: 20px;
      padding: 15px;
      background: white;
      border-radius: 12px;
      color: #475569;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px #0001;
    }

    .image {
      height: 190px;
      background: linear-gradient(135deg, #dbeafe, #e5e7eb);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 65px;
      overflow: hidden;
    }

    .image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .content {
      padding: 17px;
    }

    .content h3 {
      margin: 0 0 8px;
      padding-right: 40px;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      color: #16a34a;
      margin: 10px 0;
    }

    .details {
      color: #64748b;
      line-height: 1.6;
    }

    .deal {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 10px;
      border-radius: 20px;
      background: #dcfce7;
      color: #166534;
      font-weight: bold;
      font-size: 13px;
    }

    .source {
      display: inline-block;
      margin-top: 8px;
      margin-left: 5px;
      padding: 6px 10px;
      border-radius: 20px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 13px;
      font-weight: bold;
    }

    .save {
      float: right;
      border: none;
      background: #eef2ff;
      cursor: pointer;
      font-size: 22px;
      padding: 10px 13px;
    }

    .view-button {
      display: block;
      width: 100%;
      margin-top: 15px;
      border: none;
      background: #111827;
      color: white;
      font-weight: bold;
    }

    .empty {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
    }

    @media (max-width: 800px) {
      .search-box {
        grid-template-columns: 1fr;
        margin: 15px;
      }

      .hero,
      .results {
        margin-left: 15px;
        margin-right: 15px;
      }

      .hero h2 {
        font-size: 34px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .source-buttons {
        grid-template-columns: 1fr;
        margin: 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Deal<span>Finder</span></h1>
</header>

<section class="hero">
  <h2>Find the deals.</h2>

  <p>
    Search cars, motorbikes and parts and let DealFinder
    find listings worth checking out.
  </p>
</section>

<section class="search-box">

  <input
    id="search"
    type="text"
    placeholder="Try: S13 manual RWD"
  >

  <select id="category">
    <option value="all">Everything</option>
    <option value="Cars">Cars</option>
    <option value="Motorbikes">Motorbikes</option>
    <option value="Parts">Parts</option>
  </select>

  <input
    id="maxPrice"
    type="number"
    placeholder="Max NZ$"
  >

  <button
    class="search-button"
    onclick="searchDeals()"
  >
    🔎 Search
  </button>

</section>

<section class="source-buttons">

  <button
    class="source-button trade-button"
    onclick="searchTradeMe()"
  >
    🟠 Search Trade Me
  </button>

  <button
    class="source-button facebook-button"
    onclick="searchFacebook()"
  >
    f&nbsp;&nbsp; Search Facebook Marketplace
  </button>

</section>

<section class="results">

  <div class="status" id="status">
    Connecting to DealFinder database...
  </div>

  <h2 id="resultTitle">Loading deals...</h2>

  <div
    class="grid"
    id="listings"
  ></div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://lsjhxztfvxnukennnvgq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_sYotvwrOC6DYp7KLPjV4jw__JAmPqU1";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let listings = [];


/* -------------------------------
   LOAD LISTINGS FROM SUPABASE
-------------------------------- */

async function loadListings() {

  const status =
    document.getElementById("status");

  status.textContent =
    "🔄 Loading listings from Supabase...";

  const { data, error } =
    await supabaseClient
      .from("listings")
      .select("*")
      .order("created_at", {
        ascending: false
      });

  if (error) {

    console.error(error);

    status.textContent =
      "❌ Could not load listings from Supabase.";

    showListings([]);

    return;
  }

  listings = data || [];

  status.textContent =
    "🟢 DealFinder database connected.";

  showListings(listings);
}


/* -------------------------------
   DISPLAY LISTINGS
-------------------------------- */

function showListings(items) {

  const container =
    document.getElementById("listings");

  const title =
    document.getElementById("resultTitle");

  title.textContent =
    items.length +
    " Deal" +
    (items.length === 1 ? "" : "s");

  container.innerHTML = "";

  if (items.length === 0) {

    container.innerHTML = `
      <div class="empty">
        <h3>No deals found.</h3>
        <p>
          Try changing your search or price limit.
        </p>
      </div>
    `;

    return;
  }


  items.forEach(item => {

    const imageHTML =
      item.image_url
        ? `<img
             src="${escapeHTML(item.image_url)}"
             alt="${escapeHTML(item.title)}"
             onerror="this.parentElement.innerHTML='🚗'"
           >`
        : getIcon(item.category);


    const price =
      item.price != null
        ? "NZ$" +
          Number(item.price).toLocaleString()
        : "Price unavailable";


    const location =
      item.location ||
      "Location unavailable";


    const details =
      item.details ||
      "No details available";


    const source =
      item.source ||
      "DealFinder";


    const deal =
      getDealLabel(item.price);


    container.innerHTML += `

      <article class="card">

        <div class="image">
          ${imageHTML}
        </div>

        <div class="content">

          <button
            class="save"
            onclick="toggleSave(this)"
          >
            ♡
          </button>

          <h3>
            ${escapeHTML(item.title)}
          </h3>

          <div class="price">
            ${price}
          </div>

          <div class="details">
            📍 ${escapeHTML(location)}<br>
            ${escapeHTML(details)}
          </div>

          <span class="deal">
            ${deal}
          </span>

          <span class="source">
            ${escapeHTML(source)}
          </span>

          ${
            item.listing_url
              ? `
                <button
                  class="view-button"
                  onclick="window.open(
                    '${escapeJS(item.listing_url)}',
                    '_blank'
                  )"
                >
                  View original listing
                </button>
              `
              : ""
          }

        </div>

      </article>

    `;

  });

}


/* -------------------------------
   SEARCH
-------------------------------- */

function searchDeals() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const category =
    document.getElementById("category").value;


  const maxPrice =
    Number(
      document.getElementById("maxPrice").value
    ) || Infinity;


  const results =
    listings.filter(item => {

      const searchableText =
        (
          (item.title || "") +
          " " +
          (item.details || "") +
          " " +
          (item.location || "") +
          " " +
          (item.category || "")
        ).toLowerCase();


      const matchesSearch =
        search === "" ||
        searchableText.includes(search);


      const matchesCategory =
        category === "all" ||
        item.category === category;


      const matchesPrice =
        item.price == null ||
        Number(item.price) <= maxPrice;


      return (
        matchesSearch &&
        matchesCategory &&
        matchesPrice
      );

    });


  showListings(results);

}


/* -------------------------------
   TRADE ME SEARCH
-------------------------------- */

function searchTradeMe() {

  const search =
    document
      .getElementById("search")
      .value
      .trim();


  const query =
    search || "cars";


  const url =
    "https://www.trademe.co.nz/a/motors/cars/search?search_string=" +
    encodeURIComponent(query);


  window.open(url, "_blank");

}


/* -------------------------------
   FACEBOOK SEARCH
-------------------------------- */

function searchFacebook() {

  const search =
    document
      .getElementById("search")
      .value
      .trim();


  const query =
    search || "cars";


  const url =
    "https://www.facebook.com/marketplace/search/?query=" +
    encodeURIComponent(query);


  window.open(url, "_blank");

}


/* -------------------------------
   ICONS
-------------------------------- */

function getIcon(category) {

  if (category === "Motorbikes") {
    return "🏍️";
  }

  if (category === "Parts") {
    return "⚙️";
  }

  return "🚗";
}


/* -------------------------------
   DEAL LABEL
-------------------------------- */

function getDealLabel(price) {

  if (!price) {
    return "Check price";
  }

  if (Number(price) <= 5000) {
    return "Good price";
  }

  if (Number(price) <= 10000) {
    return "Potential deal";
  }

  return "Worth checking";
}


/* -------------------------------
   SAVE BUTTON
-------------------------------- */

function toggleSave(button) {

  if (button.textContent.trim() === "♡") {
    button.textContent = "♥";
  } else {
    button.textContent = "♡";
  }

}


/* -------------------------------
   SECURITY HELPERS
-------------------------------- */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeJS(value) {

  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "\\r");

}


/* -------------------------------
   START APP
-------------------------------- */

loadListings();

</script>

</body>
</html>
