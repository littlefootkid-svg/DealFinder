<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DealFinder</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #070707;
      color: #fff;
      min-height: 100vh;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      padding-bottom: 80px;
    }

    header {
      height: 70px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #222;
      background: #090909;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
    }

    .logo span {
      color: #fbbf24;
    }

    .account-btn {
      background: #151515;
      border: 1px solid #333;
      color: #fff;
      padding: 9px 14px;
      border-radius: 10px;
      font-weight: 700;
    }

    .screen {
      display: none;
      padding: 22px 16px;
      max-width: 1100px;
      margin: auto;
    }

    .screen.active {
      display: block;
    }

    .hero {
      padding: 35px 0 22px;
    }

    .hero h1 {
      font-size: clamp(35px, 9vw, 65px);
      line-height: .95;
      font-weight: 950;
    }

    .hero h1 span {
      color: #fbbf24;
    }

    .hero p {
      margin-top: 15px;
      color: #aaa;
      max-width: 600px;
      line-height: 1.5;
    }

    .search-box {
      margin-top: 25px;
      display: flex;
      gap: 10px;
    }

    .search-box input,
    .search-input {
      width: 100%;
      background: #111;
      color: #fff;
      border: 1px solid #333;
      border-radius: 13px;
      padding: 15px;
      outline: none;
    }

    .search-box input:focus,
    .search-input:focus {
      border-color: #fbbf24;
    }

    .primary {
      background: #fbbf24;
      color: #000;
      border: 0;
      border-radius: 13px;
      padding: 0 20px;
      font-weight: 900;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 18px 0;
    }

    .filters select {
      background: #111;
      color: #fff;
      border: 1px solid #333;
      border-radius: 11px;
      padding: 12px;
    }

    .source-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .source-btn {
      white-space: nowrap;
      background: #111;
      border: 1px solid #333;
      color: #fff;
      border-radius: 999px;
      padding: 9px 14px;
    }

    .source-btn.active {
      border-color: #fbbf24;
      color: #fbbf24;
    }

    .section-title {
      margin: 28px 0 14px;
      font-size: 21px;
    }

    .listing-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .listing {
      background: #111;
      border: 1px solid #252525;
      border-radius: 16px;
      overflow: hidden;
      transition: .15s;
    }

    .listing:hover {
      border-color: #555;
      transform: translateY(-2px);
    }

    .listing-img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #181818;
    }

    .listing-content {
      padding: 14px;
    }

    .listing-title {
      font-weight: 900;
      font-size: 17px;
    }

    .listing-price {
      color: #fbbf24;
      font-size: 20px;
      font-weight: 950;
      margin: 8px 0;
    }

    .listing-meta {
      color: #999;
      font-size: 13px;
      line-height: 1.6;
    }

    .listing-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .small-btn {
      flex: 1;
      padding: 9px;
      border-radius: 9px;
      background: #191919;
      color: #fff;
      border: 1px solid #333;
    }

    .small-btn.saved {
      color: #fbbf24;
      border-color: #fbbf24;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: #0b0b0b;
      border-top: 1px solid #252525;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 60;
    }

    .nav-btn {
      background: none;
      border: 0;
      color: #777;
      font-weight: 800;
      font-size: 12px;
    }

    .nav-btn.active {
      color: #fbbf24;
    }

    .recent-item,
    .saved-search-item {
      background: #111;
      border: 1px solid #292929;
      padding: 13px;
      border-radius: 11px;
      margin-bottom: 9px;
      cursor: pointer;
    }

    .empty {
      color: #777;
      padding: 25px 0;
    }

    /* MODALS */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 100;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 470px;
      max-height: 90vh;
      overflow-y: auto;
      background: #101010;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 22px;
      position: relative;
    }

    .close {
      position: absolute;
      right: 15px;
      top: 12px;
      background: none;
      border: 0;
      color: #aaa;
      font-size: 27px;
    }

    .modal-box h2 {
      margin-bottom: 16px;
    }

    .auth-tabs {
      display: flex;
      gap: 7px;
      margin-bottom: 16px;
    }

    .auth-tab {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #151515;
      color: #aaa;
      font-weight: 800;
    }

    .auth-tab.active {
      color: #000;
      background: #fbbf24;
      border-color: #fbbf24;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: #aaa;
      font-size: 13px;
    }

    .field input {
      width: 100%;
      padding: 13px;
      background: #080808;
      color: #fff;
      border: 1px solid #333;
      border-radius: 10px;
      outline: none;
    }

    .auth-submit {
      width: 100%;
      padding: 13px;
      background: #fbbf24;
      border: 0;
      border-radius: 11px;
      color: #000;
      font-weight: 950;
      margin-top: 5px;
    }

    .auth-message {
      margin-top: 12px;
      color: #aaa;
      font-size: 13px;
      line-height: 1.5;
    }

    .guest-btn {
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      background: #171717;
      color: #fff;
      border: 1px solid #333;
      border-radius: 10px;
    }

    /* LISTING MODAL */

    .detail-image {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 13px;
      margin-bottom: 15px;
    }

    .detail-price {
      color: #fbbf24;
      font-size: 25px;
      font-weight: 950;
      margin: 7px 0;
    }

    .detail-description {
      color: #aaa;
      line-height: 1.6;
      margin-top: 12px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .detail-item {
      background: #171717;
      padding: 10px;
      border-radius: 9px;
    }

    .detail-item small {
      display: block;
      color: #777;
      margin-bottom: 3px;
    }

    .external-link {
      display: block;
      width: 100%;
      text-align: center;
      margin-top: 15px;
      padding: 13px;
      border-radius: 11px;
      background: #fbbf24;
      color: #000;
      font-weight: 950;
      text-decoration: none;
    }

    /* SPEEDOMETER */

    .gauge-wrap {
      display: flex;
      justify-content: center;
      margin: 22px 0 35px;
    }

    .gauge {
      position: relative;
      width: 210px;
      height: 120px;
      border-radius: 210px 210px 0 0;
      background:
        conic-gradient(
          from 270deg,
          #ef4444 0deg,
          #fbbf24 55deg,
          #22c55e 105deg,
          #22c55e 180deg
        );
      overflow: visible;
    }

    .gauge::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 0;
      height: 100px;
      background: #101010;
      border-radius: 190px 190px 0 0;
    }

    .gauge-needle {
      position: absolute;
      width: 5px;
      height: 82px;
      background: #fff;
      left: 50%;
      bottom: 8px;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(0deg);
      border-radius: 5px;
      z-index: 4;
    }

    .gauge-center {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fbbf24;
      left: 50%;
      bottom: 2px;
      transform: translateX(-50%);
      z-index: 5;
    }

    .gauge-score {
      position: absolute;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      z-index: 6;
      font-size: 27px;
      font-weight: 950;
    }

    /*
      MID is mathematically centred horizontally.
      It sits below the needle/stick.
    */
    .gauge-mid {
      position: absolute;
      left: 50%;
      bottom: -25px;
      transform: translateX(-50%);
      color: #fbbf24;
      font-size: 11px;
      font-weight: 900;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      z-index: 8;
    }

    .account-info {
      color: #aaa;
      line-height: 1.7;
      margin-bottom: 18px;
    }

    .logout-btn {
      width: 100%;
      padding: 13px;
      background: #191919;
      border: 1px solid #333;
      color: #fff;
      border-radius: 11px;
      font-weight: 800;
    }

    @media (max-width: 750px) {
      .listing-grid {
        grid-template-columns: 1fr 1fr;
      }

      .filters {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .listing-grid {
        grid-template-columns: 1fr;
      }

      .search-box {
        flex-direction: column;
      }

      .primary {
        height: 48px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">Deal<span>Finder</span></div>
    <button class="account-btn" onclick="openAccount()">Account</button>
  </header>

  <!-- HOME -->

  <main id="homeScreen" class="screen active">

    <section class="hero">
      <h1>Find the<br><span>deal.</span></h1>
      <p>
        Search cars, compare listings and discover potentially great deals
        from multiple marketplaces.
      </p>

      <div class="search-box">
        <input
          id="homeSearch"
          placeholder="Try: manual RWD under $10k"
          onkeydown="if(event.key==='Enter') runHomeSearch()"
        />
        <button class="primary" onclick="runHomeSearch()">Search</button>
      </div>
    </section>

    <div class="filters">
      <select id="priceFilter">
        <option value="">Any price</option>
        <option value="5000">Under $5,000</option>
        <option value="10000">Under $10,000</option>
        <option value="15000">Under $15,000</option>
        <option value="25000">Under $25,000</option>
      </select>

      <select id="transmissionFilter">
        <option value="">Any transmission</option>
        <option value="Manual">Manual</option>
        <option value="Automatic">Automatic</option>
      </select>

      <select id="driveFilter">
        <option value="">Any drivetrain</option>
        <option value="RWD">RWD</option>
        <option value="AWD">AWD</option>
        <option value="FWD">FWD</option>
      </select>
    </div>

    <div class="source-row">
      <button class="source-btn active">All</button>
      <button class="source-btn" onclick="openTradeMe()">Trade Me</button>
      <button class="source-btn" onclick="openFacebook()">Facebook Marketplace</button>
    </div>

    <h2 class="section-title">Listings</h2>

    <div id="homeListings" class="listing-grid"></div>

  </main>

  <!-- SEARCH -->

  <main id="searchScreen" class="screen">

    <h2 class="section-title">Search DealFinder</h2>

    <div class="search-box">
      <input
        id="dedicatedSearch"
        class="search-input"
        placeholder="Search cars..."
        onkeydown="if(event.key==='Enter') performDedicatedSearch()"
      />
      <button class="primary" onclick="performDedicatedSearch()">Search</button>
    </div>

    <h3 class="section-title">Recent searches</h3>
    <div id="recentSearches"></div>

    <h3 class="section-title">Results</h3>
    <div id="searchResults" class="listing-grid"></div>

  </main>

  <!-- SAVED -->

  <main id="savedScreen" class="screen">

    <h2 class="section-title">Saved</h2>

    <div id="savedListings" class="listing-grid"></div>

    <h3 class="section-title">Saved searches</h3>

    <div id="savedSearches"></div>

  </main>

</div>

<!-- BOTTOM NAV -->

<nav class="bottom-nav">
  <button id="navHome" class="nav-btn active" onclick="showScreen('home')">
    Home
  </button>

  <button id="navSearch" class="nav-btn" onclick="showScreen('search')">
    Search
  </button>

  <button id="navSaved" class="nav-btn" onclick="showScreen('saved')">
    Saved
  </button>
</nav>

<!-- AUTH MODAL -->

<div id="authModal" class="modal">

  <div class="modal-box">

    <button class="close" onclick="closeAuth()">×</button>

    <h2>Welcome to DealFinder</h2>

    <div class="auth-tabs">
      <button id="loginTab" class="auth-tab active" onclick="setAuthMode('login')">
        Log In
      </button>

      <button id="signupTab" class="auth-tab" onclick="setAuthMode('signup')">
        Sign Up
      </button>
    </div>

    <div class="field">
      <label>Email</label>
      <input id="authEmail" type="email" placeholder="you@example.com" />
    </div>

    <div class="field">
      <label>Password</label>
      <input id="authPassword" type="password" placeholder="Password" />
    </div>

    <button class="auth-submit" onclick="handleAuth()">
      <span id="authSubmitText">Log In</span>
    </button>

    <div id="authMessage" class="auth-message"></div>

    <button class="guest-btn" onclick="closeAuth()">
      Continue as guest
    </button>

  </div>
</div>

<!-- LISTING MODAL -->

<div id="listingModal" class="modal">

  <div class="modal-box">

    <button class="close" onclick="closeListing()">×</button>

    <img id="detailImage" class="detail-image" src="" alt="Car">

    <h2 id="detailTitle"></h2>

    <div id="detailPrice" class="detail-price"></div>

    <div id="detailMeta" class="listing-meta"></div>

    <div class="gauge-wrap">
      <div class="gauge">

        <div id="gaugeNeedle" class="gauge-needle"></div>

        <div class="gauge-center"></div>

        <div id="gaugeScore" class="gauge-score">50</div>

        <div class="gauge-mid">MID</div>

      </div>
    </div>

    <div id="detailDescription" class="detail-description"></div>

    <div id="detailGrid" class="detail-grid"></div>

    <a
      id="externalListingLink"
      class="external-link"
      href="#"
      target="_blank"
      rel="noopener"
    >
      Open Original Listing
    </a>

  </div>
</div>

<!-- ACCOUNT MODAL -->

<div id="accountModal" class="modal">

  <div class="modal-box">

    <button class="close" onclick="closeAccount()">×</button>

    <h2>Your Account</h2>

    <div id="accountInfo" class="account-info"></div>

    <button class="logout-btn" onclick="logout()">
      Log Out
    </button>

  </div>
</div>

<script type="module">

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  window.supabaseClient = supabase;

  let authMode = "login";
  let listings = [];
  let recentSearches = [];
  let savedListings = [];
  let savedSearches = [];

  /* -----------------------------
     DEMO LISTINGS
  ----------------------------- */

  const demoListings = [

  ];

  /* -----------------------------
     SCREEN NAVIGATION
  ----------------------------- */

  window.showScreen = function(screen) {

    document.querySelectorAll(".screen")
      .forEach(el => el.classList.remove("active"));

    document.querySelectorAll(".nav-btn")
      .forEach(el => el.classList.remove("active"));

    if (screen === "home") {
      document.getElementById("homeScreen").classList.add("active");
      document.getElementById("navHome").classList.add("active");
    }

    if (screen === "search") {
      document.getElementById("searchScreen").classList.add("active");
      document.getElementById("navSearch").classList.add("active");
    }

    if (screen === "saved") {
      document.getElementById("savedScreen").classList.add("active");
      document.getElementById("navSaved").classList.add("active");
      renderSavedListings();
    }
  };

  /* -----------------------------
     HOME SEARCH
  ----------------------------- */

  window.runHomeSearch = function() {

    const query =
      document.getElementById("homeSearch").value.trim();

    if (query) {
      addRecentSearch(query);
    }

    document.getElementById("dedicatedSearch").value = query;

    showScreen("search");

    performDedicatedSearch();
  };

  window.performDedicatedSearch = function() {

    const query =
      document.getElementById("dedicatedSearch").value
        .trim()
        .toLowerCase();

    if (query) {
      addRecentSearch(query);
    }

    let results = [...listings];

    const price =
      document.getElementById("priceFilter").value;

    const transmission =
      document.getElementById("transmissionFilter").value;

    const drive =
      document.getElementById("driveFilter").value;

    if (price) {
      results = results.filter(
        car => Number(car.price || 0) <= Number(price)
      );
    }

    if (transmission) {
      results = results.filter(
        car => String(car.transmission || "")
          .toLowerCase() === transmission.toLowerCase()
      );
    }

    if (drive) {
      results = results.filter(
        car => String(car.drive || "")
          .toLowerCase() === drive.toLowerCase()
      );
    }

    if (query) {

      const words = query
        .split(/\s+/)
        .filter(Boolean);

      results = results.filter(car => {

        const searchable = [
          car.title,
          car.make,
          car.model,
          car.location,
          car.description,
          car.details,
          car.transmission,
          car.drive
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();

        return words.every(word =>
          searchable.includes(word)
        );
      });
    }

    renderListings(
      "searchResults",
      results
    );
  };

  /* -----------------------------
     LISTINGS
  ----------------------------- */

  function renderListings(containerId, data) {

    const container =
      document.getElementById(containerId);

    if (!data.length) {
      container.innerHTML =
        `<div class="empty">No listings found.</div>`;
      return;
    }

    container.innerHTML =
      data.map(renderListingCard).join("");
  }

  function renderListingCard(car) {

    const saved =
      savedListings.some(
        item => String(item.id) === String(car.id)
      );

    const image =
      car.image_url ||
      "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1000&q=80";

    return `
      <article class="listing">

        <img
          class="listing-img"
          src="${escapeHTML(image)}"
          alt="${escapeHTML(car.title || "Car listing")}"
          onerror="this.src='https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1000&q=80'"
        >

        <div class="listing-content">

          <div class="listing-title">
            ${escapeHTML(car.title || "Untitled listing")}
          </div>

          <div class="listing-price">
            ${formatPrice(car.price, car.currency)}
          </div>

          <div class="listing-meta">
            ${escapeHTML(car.location || "Location unknown")}
            <br>
            ${escapeHTML(car.transmission || "Transmission unknown")}
            ·
            ${escapeHTML(car.drive || "Drive unknown")}
            <br>
            ${car.year ? escapeHTML(car.year) : ""}
            ${car.mileage ? " · " + Number(car.mileage).toLocaleString() + " km" : ""}
          </div>

          <div class="listing-actions">

            <button
              class="small-btn"
              onclick="openListing('${String(car.id).replace(/'/g, "\\'")}')"
            >
              View
            </button>

            <button
              class="small-btn ${saved ? "saved" : ""}"
              onclick="toggleSave('${String(car.id).replace(/'/g, "\\'")}')"
            >
              ${saved ? "★ Saved" : "☆ Save"}
            </button>

          </div>

        </div>
      </article>
    `;
  }

  function renderHome() {
    renderListings("homeListings", listings);
  }

  /* -----------------------------
     LISTING MODAL
  ----------------------------- */

  window.openListing = function(id) {

    const car =
      listings.find(
        item => String(item.id) === String(id)
      );

    if (!car) return;

    const score = calculateDealScore(car);

    document.getElementById("detailImage").src =
      car.image_url ||
      "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1000&q=80";

    document.getElementById("detailTitle").textContent =
      car.title || "Untitled listing";

    document.getElementById("detailPrice").textContent =
      formatPrice(car.price, car.currency);

    document.getElementById("detailMeta").textContent =
      [
        car.location,
        car.source,
        car.transmission,
        car.drive
      ]
      .filter(Boolean)
      .join(" · ");

    document.getElementById("detailDescription").textContent =
      car.description ||
      car.details ||
      "No description available.";

    document.getElementById("detailGrid").innerHTML = `

      <div class="detail-item">
        <small>Make</small>
        ${escapeHTML(car.make || "Unknown")}
      </div>

      <div class="detail-item">
        <small>Model</small>
        ${escapeHTML(car.model || "Unknown")}
      </div>

      <div class="detail-item">
        <small>Year</small>
        ${escapeHTML(car.year || "Unknown")}
      </div>

      <div class="detail-item">
        <small>Mileage</small>
        ${
          car.mileage
            ? Number(car.mileage).toLocaleString() + " km"
            : "Unknown"
        }
      </div>

      <div class="detail-item">
        <small>Transmission</small>
        ${escapeHTML(car.transmission || "Unknown")}
      </div>

      <div class="detail-item">
        <small>Drive</small>
        ${escapeHTML(car.drive || "Unknown")}
      </div>

    `;

    document.getElementById("gaugeScore").textContent =
      score;

    const needle =
      document.getElementById("gaugeNeedle");

    const rotation =
      -90 + (score / 100) * 180;

    needle.style.transform =
      `translateX(-50%) rotate(${rotation}deg)`;

    const link =
      document.getElementById("externalListingLink");

    if (
      car.listing_url &&
      car.listing_url !== "#"
    ) {
      link.href = car.listing_url;
      link.style.display = "block";
    } else {
      link.href = "#";
      link.style.display = "none";
    }

    document
      .getElementById("listingModal")
      .classList.add("show");
  };

  window.closeListing = function() {
    document
      .getElementById("listingModal")
      .classList.remove("show");
  };

  function calculateDealScore(car) {

    let score = 50;

    const price =
      Number(car.price || 0);

    if (price > 0) {

      if (price <= 5000) score += 25;
      else if (price <= 10000) score += 15;
      else if (price <= 15000) score += 8;
      else if (price >= 30000) score -= 10;
    }

    if (
      String(car.transmission || "")
        .toLowerCase()
        .includes("manual")
    ) {
      score += 5;
    }

    if (
      String(car.drive || "")
        .toLowerCase()
        .includes("rwd")
    ) {
      score += 5;
    }

    if (car.image_url) score += 3;
    if (car.description) score += 3;

    return Math.max(
      1,
      Math.min(99, score)
    );
  }

  /* -----------------------------
     SAVED LISTINGS
  ----------------------------- */

  window.toggleSave = function(id) {

    const index =
      savedListings.findIndex(
        item => String(item.id) === String(id)
      );

    if (index >= 0) {
      savedListings.splice(index, 1);
    } else {

      const car =
        listings.find(
          item => String(item.id) === String(id)
        );

      if (car) {
        savedListings.push(car);
      }
    }

    localStorage.setItem(
      "dealfinder_saved",
      JSON.stringify(savedListings)
    );

    renderHome();
    renderListings(
      "searchResults",
      getCurrentSearchResults()
    );
    renderSavedListings();
  };

  function renderSavedListings() {

    const container =
      document.getElementById("savedListings");

    if (!savedListings.length) {
      container.innerHTML =
        `<div class="empty">You haven't saved any listings yet.</div>`;
      return;
    }

    renderListings(
      "savedListings",
      savedListings
    );
  }

  function getCurrentSearchResults() {

    const query =
      document.getElementById("dedicatedSearch")
        ?.value
        ?.trim()
        .toLowerCase() || "";

    if (!query) return listings;

    return listings.filter(car => {

      const searchable = [
        car.title,
        car.make,
        car.model,
        car.location,
        car.description,
        car.details
      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

      return query
        .split(/\s+/)
        .every(word => searchable.includes(word));
    });
  }

  /* -----------------------------
     RECENT SEARCHES
  ----------------------------- */

  function addRecentSearch(query) {

    query = query.trim();

    if (!query) return;

    recentSearches =
      recentSearches.filter(
        item => item.toLowerCase() !== query.toLowerCase()
      );

    recentSearches.unshift(query);

    recentSearches =
      recentSearches.slice(0, 8);

    localStorage.setItem(
      "dealfinder_recent",
      JSON.stringify(recentSearches)
    );

    renderRecentSearches();
  }

  function renderRecentSearches() {

    const container =
      document.getElementById("recentSearches");

    if (!recentSearches.length) {
      container.innerHTML =
        `<div class="empty">No recent searches.</div>`;
      return;
    }

    container.innerHTML =
      recentSearches.map(query => `
        <div
          class="recent-item"
          onclick="useRecentSearch('${escapeJS(query)}')"
        >
          🔎 ${escapeHTML(query)}
        </div>
      `).join("");
  }

  window.useRecentSearch = function(query) {

    document.getElementById(
      "dedicatedSearch"
    ).value = query;

    performDedicatedSearch();
  };

  /* -----------------------------
     SAVED SEARCHES
  ----------------------------- */

  function renderSavedSearches() {

    const container =
      document.getElementById("savedSearches");

    if (!savedSearches.length) {
      container.innerHTML =
        `<div class="empty">No saved searches.</div>`;
      return;
    }

    container.innerHTML =
      savedSearches.map(query => `
        <div class="saved-search-item">
          🔎 ${escapeHTML(query)}
        </div>
      `).join("");
  }

  /* -----------------------------
     AUTH
  ----------------------------- */

  window.setAuthMode = function(mode) {

    authMode = mode;

    document
      .getElementById("loginTab")
      .classList.toggle(
        "active",
        mode === "login"
      );

    document
      .getElementById("signupTab")
      .classList.toggle(
        "active",
        mode === "signup"
      );

    document.getElementById(
      "authSubmitText"
    ).textContent =
      mode === "login"
        ? "Log In"
        : "Create Account";

    document.getElementById(
      "authMessage"
    ).textContent = "";
  };

  /*
    THIS IS THE IMPORTANT FIX.

    After signup, if Supabase gives us a session,
    we immediately close the login window.

    The user does NOT need to click Log In again.
  */

  window.handleAuth = async function() {

    const email =
      document.getElementById("authEmail")
        .value
        .trim();

    const password =
      document.getElementById("authPassword")
        .value;

    const message =
      document.getElementById("authMessage");

    if (!email || !password) {
      message.textContent =
        "Please enter your email and password.";
      return;
    }

    message.textContent =
      "Please wait...";

    if (authMode === "signup") {

      const {
        data,
        error
      } = await supabase.auth.signUp({

        email,
        password,

        options: {
          emailRedirectTo:
            AUTH_REDIRECT_URL
        }

      });

      if (error) {

        message.textContent =
          error.message;

        return;
      }

      /*
        If email confirmation is disabled,
        Supabase returns a session immediately.
      */

      if (data.session) {

        message.textContent =
          "Account created! You're logged in.";

        document
          .getElementById("authModal")
          .classList.remove("show");

        updateAuthUI();

        return;
      }

      /*
        If email confirmation is enabled,
        the user needs to verify their email.
      */

      message.textContent =
        "Account created! Check your email to verify your account.";

      return;
    }

    /* LOGIN */

    const {
      data,
      error
    } = await supabase.auth.signInWithPassword({

      email,
      password

    });

    if (error) {

      message.textContent =
        error.message;

      return;
    }

    if (data.session) {

      message.textContent =
        "Logged in!";

      document
        .getElementById("authModal")
        .classList.remove("show");

      updateAuthUI();
    }
  };

  /*
    Automatically update the app whenever
    Supabase detects a login session.
  */

  supabase.auth.onAuthStateChange(
    (event, session) => {

      updateAuthUI();

      if (session) {

        document
          .getElementById("authModal")
          .classList.remove("show");

      }
    }
  );

  window.closeAuth = function() {

    document
      .getElementById("authModal")
      .classList.remove("show");
  };

  async function updateAuthUI() {

    const {
      data
    } = await supabase.auth.getSession();

    const session = data.session;

    const button =
      document.querySelector(".account-btn");

    if (session) {

      button.textContent =
        "Account";

    } else {

      button.textContent =
        "Log In";

    }
  }

  /* -----------------------------
     ACCOUNT
  ----------------------------- */

  window.openAccount = async function() {

    const {
      data
    } = await supabase.auth.getSession();

    const session =
      data.session;

    if (!session) {

      authMode = "login";
      setAuthMode("login");

      document
        .getElementById("authModal")
        .classList.add("show");

      return;
    }

    document.getElementById(
      "accountInfo"
    ).innerHTML = `
      <strong>Signed in as:</strong><br>
      ${escapeHTML(session.user.email)}
    `;

    document
      .getElementById("accountModal")
      .classList.add("show");
  };

  window.closeAccount = function() {

    document
      .getElementById("accountModal")
      .classList.remove("show");
  };

  window.logout = async function() {

    await supabase.auth.signOut();

    closeAccount();

    authMode = "login";
    setAuthMode("login");

    document
      .getElementById("authModal")
      .classList.add("show");

    updateAuthUI();
  };

  /* -----------------------------
     SUPABASE LISTINGS
  ----------------------------- */

  async function loadSupabaseListings() {

    try {

      const {
        data,
        error
      } = await supabase
        .from("listings")
        .select("*")
        .eq("is_active", true)
        .order("created_at", {
          ascending: false
        });

      if (error) {
        console.error(
          "Supabase listings error:",
          error
        );

        listings = [...demoListings];

      } else {

        listings =
          data && data.length
            ? data
            : [...demoListings];
      }

    } catch (error) {

      console.error(error);

      listings = [...demoListings];
    }

    renderHome();
    renderSavedListings();
  }

  /* -----------------------------
     EXTERNAL SEARCH
  ----------------------------- */

  window.openTradeMe = function() {

    const query =
      document.getElementById("homeSearch")
        .value
        .trim();

    const url =
      "https://www.trademe.co.nz/a/motors/cars/search?search_string=" +
      encodeURIComponent(query || "cars");

    window.open(
      url,
      "_blank"
    );
  };

  window.openFacebook = function() {

    window.open(
      "https://www.facebook.com/marketplace/",
      "_blank"
    );
  };

  /* -----------------------------
     HELPERS
  ----------------------------- */

  function formatPrice(price, currency = "NZD") {

    if (
      price === null ||
      price === undefined ||
      price === ""
    ) {
      return "Price unknown";
    }

    return new Intl.NumberFormat(
      "en-NZ",
      {
        style: "currency",
        currency: currency || "NZD",
        maximumFractionDigits: 0
      }
    ).format(Number(price));
  }

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function escapeJS(value) {

    return String(value ?? "")
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");
  }

  /* -----------------------------
     LOAD SAVED DATA
  ----------------------------- */

  try {

    recentSearches =
      JSON.parse(
        localStorage.getItem(
          "dealfinder_recent"
        )
      ) || [];

    savedListings =
      JSON.parse(
        localStorage.getItem(
          "dealfinder_saved"
        )
      ) || [];

  } catch {

    recentSearches = [];
    savedListings = [];
  }

  renderRecentSearches();
  renderSavedSearches();

  /* -----------------------------
     APP BOOT
  ----------------------------- */

  async function bootApp() {

    renderHome();

    await updateAuthUI();

    const {
      data
    } = await supabase.auth.getSession();

    /*
      FIRST SCREEN:
      If there is no existing session,
      show login/sign-up immediately.
    */

    if (!data.session) {

      authMode = "login";

      setAuthMode("login");

      document
        .getElementById("authModal")
        .classList.add("show");
    }

    await loadSupabaseListings();
  }

  bootApp();

</script>
