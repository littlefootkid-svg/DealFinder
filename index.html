<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DealFinder</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 26px;
    }

    header span {
      color: #22c55e;
    }

    .saved-count {
      background: #22c55e;
      color: #07130b;
      padding: 7px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
    }

    .hero {
      background: linear-gradient(135deg, #111827, #1f2937);
      color: white;
      padding: 55px 20px;
      text-align: center;
    }

    .hero h2 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #d1d5db;
      font-size: 18px;
      max-width: 650px;
      margin: auto;
    }

    .search-panel {
      max-width: 1100px;
      margin: -25px auto 30px;
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      position: relative;
      z-index: 5;
    }

    .search-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 10px;
    }

    input,
    select,
    button {
      font: inherit;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #22c55e;
    }

    .search-btn {
      background: #22c55e;
      border: none;
      padding: 13px 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .search-btn:hover {
      background: #16a34a;
    }

    .source-buttons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .source-buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .trade-btn {
      background: #facc15;
    }

    .facebook-btn {
      background: #3b82f6;
      color: white;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 0 20px 50px;
    }

    .top-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .top-line h2 {
      font-size: 24px;
    }

    #status {
      color: #6b7280;
      font-size: 14px;
    }

    .listings {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .listing-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      transition: transform 0.15s, box-shadow 0.15s;
      cursor: pointer;
      position: relative;
    }

    .listing-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.14);
    }

    .listing-image {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #e5e7eb;
      display: block;
    }

    .no-image {
      height: 190px;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
    }

    .listing-content {
      padding: 16px;
    }

    .listing-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 8px;
      padding-right: 30px;
    }

    .price {
      font-size: 23px;
      font-weight: bold;
      color: #16a34a;
      margin-bottom: 8px;
    }

    .location {
      color: #6b7280;
      margin-bottom: 10px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      background: #f3f4f6;
      border-radius: 20px;
      padding: 5px 8px;
      font-size: 12px;
      color: #374151;
    }

    .source {
      margin-top: 12px;
      font-size: 12px;
      color: #6b7280;
    }

    .heart {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: white;
      font-size: 21px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      z-index: 3;
    }

    .heart.saved {
      color: #ef4444;
    }

    .empty {
      background: white;
      border-radius: 16px;
      padding: 45px 20px;
      text-align: center;
      color: #6b7280;
      grid-column: 1 / -1;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 500;
      padding: 20px;
      overflow-y: auto;
    }

    .modal.show {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 700px;
      border-radius: 20px;
      margin: 30px auto;
      overflow: hidden;
      position: relative;
    }

    .modal-image {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      background: #e5e7eb;
    }

    .modal-body {
      padding: 25px;
    }

    .close {
      position: absolute;
      right: 15px;
      top: 15px;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: white;
      font-size: 25px;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0,0,0,0.2);
      z-index: 2;
    }

    .modal-body h2 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .modal-price {
      color: #16a34a;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .description {
      line-height: 1.6;
      color: #374151;
      margin: 18px 0;
      white-space: pre-wrap;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 20px 0;
    }

    .detail {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 10px;
    }

    .detail strong {
      display: block;
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .listing-link {
      display: block;
      text-align: center;
      background: #111827;
      color: white;
      padding: 14px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    .listing-link:hover {
      background: #374151;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #6b7280;
      font-size: 13px;
    }

    @media (max-width: 850px) {
      .listings {
        grid-template-columns: repeat(2, 1fr);
      }

      .search-row {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 550px) {
      .hero h2 {
        font-size: 32px;
      }

      .listings {
        grid-template-columns: 1fr;
      }

      .search-row {
        grid-template-columns: 1fr;
      }

      .source-buttons {
        flex-direction: column;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Deal<span>Finder</span></h1>
  <div class="saved-count">
    ❤️ <span id="savedCount">0</span>
  </div>
</header>

<section class="hero">
  <h2>Find the deal. 🚗</h2>
  <p>
    Search cars, motorbikes and parts in one place.
    Find something cool without hunting through a million listings.
  </p>
</section>

<section class="search-panel">

  <div class="search-row">

    <input
      id="searchInput"
      type="text"
      placeholder="Search S13, MX-5, CBR, SR20..."
    />

    <select id="categorySelect">
      <option value="">All categories</option>
      <option value="Cars">Cars</option>
      <option value="Motorbikes">Motorbikes</option>
      <option value="Parts">Parts</option>
    </select>

    <input
      id="maxPrice"
      type="number"
      placeholder="Max price NZ$"
    />

    <button class="search-btn" onclick="applyFilters()">
      Search
    </button>

  </div>

  <div class="source-buttons">

    <button class="trade-btn" onclick="openTradeMe()">
      🟡 Search Trade Me
    </button>

    <button class="facebook-btn" onclick="openFacebook()">
      🔵 Search Facebook Marketplace
    </button>

  </div>

</section>

<main>

  <div class="top-line">
    <h2>Listings</h2>
    <div id="status">Loading...</div>
  </div>

  <div id="listings" class="listings"></div>

</main>

<footer>
  DealFinder — find cool stuff without the endless scrolling.
</footer>

<!-- LISTING MODAL -->

<div id="modal" class="modal">

  <div class="modal-box">

    <button class="close" onclick="closeModal()">×</button>

    <div id="modalImage"></div>

    <div class="modal-body">

      <h2 id="modalTitle"></h2>

      <div id="modalPrice" class="modal-price"></div>

      <div id="modalDescription" class="description"></div>

      <div class="detail-grid">

        <div class="detail">
          <strong>Category</strong>
          <span id="modalCategory"></span>
        </div>

        <div class="detail">
          <strong>Location</strong>
          <span id="modalLocation"></span>
        </div>

        <div class="detail">
          <strong>Source</strong>
          <span id="modalSource"></span>
        </div>

        <div class="detail">
          <strong>Last checked</strong>
          <span id="modalChecked"></span>
        </div>

      </div>

      <a
        id="modalLink"
        class="listing-link"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open original listing →
      </a>

    </div>

  </div>

</div>

<script type="module">

  /* =========================================================
     SUPABASE
     ========================================================= */

  import {
    createClient
  } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const SUPABASE_URL =
    "https://lsjhxztfvxnukennnvgq.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_sYotvwrOC6DYp7KLPjV4jw__JAmPqU1";

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  /* =========================================================
     STATE
     ========================================================= */

  let allListings = [];

  let savedListings =
    JSON.parse(localStorage.getItem("dealfinder_saved") || "[]");


  /* =========================================================
     HELPERS
     ========================================================= */

  function escapeHTML(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function money(value) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {
      return "Price not listed";
    }

    const number = Number(
      String(value).replace(/[^0-9.-]/g, "")
    );

    if (Number.isNaN(number)) {
      return escapeHTML(value);
    }

    return "NZ$" +
      number.toLocaleString("en-NZ");
  }


  function getListingId(listing) {

    return String(
      listing.id ||
      listing.external_id ||
      listing.listing_url ||
      listing.url ||
      listing.title
    );

  }


  function isSaved(listing) {

    return savedListings.includes(
      getListingId(listing)
    );

  }


  function saveState() {

    localStorage.setItem(
      "dealfinder_saved",
      JSON.stringify(savedListings)
    );

    updateSavedCount();

  }


  function updateSavedCount() {

    document.getElementById("savedCount").textContent =
      savedListings.length;

  }


  /* =========================================================
     LOAD REAL SUPABASE LISTINGS
     ========================================================= */

  async function loadListings() {

    const status =
      document.getElementById("status");

    status.textContent = "Loading listings...";

    try {

      const {
        data,
        error
      } = await supabase
        .from("listings")
        .select("*")
        .order("created_at", {
          ascending: false
        });

      if (error) {
        throw error;
      }

      allListings = data || [];

      renderListings(allListings);

      status.textContent =
        `${allListings.length} listing${allListings.length === 1 ? "" : "s"}`;

    } catch (error) {

      console.error(error);

      status.textContent =
        "Could not load listings";

      document.getElementById("listings").innerHTML = `
        <div class="empty">
          <h3>⚠️ Couldn't load listings</h3>
          <p>
            Check your Supabase connection and make sure
            the <strong>listings</strong> table exists.
          </p>
        </div>
      `;

    }

  }


  /* =========================================================
     RENDER LISTINGS
     ========================================================= */

  function renderListings(listings) {

    const container =
      document.getElementById("listings");

    if (!listings.length) {

      container.innerHTML = `
        <div class="empty">
          <h3>No listings found 😭</h3>
          <p>
            Try another search or check back when
            new listings are added.
          </p>
        </div>
      `;

      return;
    }


    container.innerHTML =
      listings.map((listing, index) => {

        const title =
          listing.title || "Untitled listing";

        const price =
          listing.price;

        const description =
          listing.description ||
          "No description available.";

        const category =
          listing.category ||
          "Other";

        const location =
          listing.location ||
          "Location not listed";

        const source =
          listing.source ||
          "Unknown source";

        const image =
          listing.image_url ||
          listing.image ||
          "";

        const saved =
          isSaved(listing);


        return `

          <article
            class="listing-card"
            onclick="openListing(${index})"
          >

            <button
              class="heart ${saved ? "saved" : ""}"
              onclick="event.stopPropagation(); toggleSaved(${index})"
              aria-label="Save listing"
            >
              ${saved ? "❤️" : "♡"}
            </button>

            ${
              image
              ?
              `<img
                class="listing-image"
                src="${escapeHTML(image)}"
                alt="${escapeHTML(title)}"
                onerror="this.outerHTML='<div class=&quot;no-image&quot;>🚗</div>'"
              >`
              :
              `<div class="no-image">🚗</div>`
            }

            <div class="listing-content">

              <div class="listing-title">
                ${escapeHTML(title)}
              </div>

              <div class="price">
                ${money(price)}
              </div>

              <div class="location">
                📍 ${escapeHTML(location)}
              </div>

              <div class="tags">

                <span class="tag">
                  ${escapeHTML(category)}
                </span>

                ${
                  listing.transmission
                  ?
                  `<span class="tag">
                    ${escapeHTML(listing.transmission)}
                  </span>`
                  :
                  ""
                }

                ${
                  listing.drive
                  ?
                  `<span class="tag">
                    ${escapeHTML(listing.drive)}
                  </span>`
                  :
                  ""
                }

              </div>

              <div class="source">
                Source: ${escapeHTML(source)}
              </div>

            </div>

          </article>

        `;

      }).join("");

  }


  /* =========================================================
     SEARCH / FILTER
     ========================================================= */

  window.applyFilters = function() {

    const search =
      document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const category =
      document
        .getElementById("categorySelect")
        .value;

    const maxPriceValue =
      document
        .getElementById("maxPrice")
        .value;

    const maxPrice =
      maxPriceValue
      ?
      Number(maxPriceValue)
      :
      Infinity;


    const filtered =
      allListings.filter(listing => {

        const searchable = [

          listing.title,
          listing.description,
          listing.category,
          listing.location,
          listing.source,
          listing.transmission,
          listing.drive

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


        const numberPrice =
          Number(
            String(listing.price || "")
              .replace(/[^0-9.-]/g, "")
          );


        const matchesSearch =
          !search ||
          searchable.includes(search);


        const matchesCategory =
          !category ||
          String(listing.category || "")
            .toLowerCase() ===
          category.toLowerCase();


        const matchesPrice =
          !maxPriceValue ||
          (
            !Number.isNaN(numberPrice) &&
            numberPrice <= maxPrice
          );


        return (
          matchesSearch &&
          matchesCategory &&
          matchesPrice
        );

      });


    renderListings(filtered);

    document.getElementById("status").textContent =
      `${filtered.length} result${filtered.length === 1 ? "" : "s"}`;

  };


  /* =========================================================
     SAVED LISTINGS
     ========================================================= */

  window.toggleSaved = function(index) {

    const listing =
      getCurrentlyDisplayedListings()[index];

    if (!listing) return;

    const id =
      getListingId(listing);

    if (savedListings.includes(id)) {

      savedListings =
        savedListings.filter(
          savedId => savedId !== id
        );

    } else {

      savedListings.push(id);

    }

    saveState();

    applyFilters();

  };


  function getCurrentlyDisplayedListings() {

    const search =
      document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const category =
      document
        .getElementById("categorySelect")
        .value;

    const maxPriceValue =
      document
        .getElementById("maxPrice")
        .value;

    const maxPrice =
      maxPriceValue
      ?
      Number(maxPriceValue)
      :
      Infinity;


    return allListings.filter(listing => {

      const searchable = [

        listing.title,
        listing.description,
        listing.category,
        listing.location,
        listing.source,
        listing.transmission,
        listing.drive

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();


      const numberPrice =
        Number(
          String(listing.price || "")
            .replace(/[^0-9.-]/g, "")
        );


      return (

        (!search ||
          searchable.includes(search))

        &&

        (!category ||
          String(listing.category || "")
            .toLowerCase() ===
          category.toLowerCase())

        &&

        (!maxPriceValue ||
          (
            !Number.isNaN(numberPrice) &&
            numberPrice <= maxPrice
          ))

      );

    });

  }


  /* =========================================================
     OPEN LISTING
     ========================================================= */

  window.openListing = function(index) {

    const listing =
      getCurrentlyDisplayedListings()[index];

    if (!listing) return;


    document.getElementById("modalTitle").textContent =
      listing.title || "Untitled listing";


    document.getElementById("modalPrice").textContent =
      money(listing.price);


    document.getElementById("modalDescription").textContent =
      listing.description ||
      "No description available.";


    document.getElementById("modalCategory").textContent =
      listing.category ||
      "Not listed";


    document.getElementById("modalLocation").textContent =
      listing.location ||
      "Not listed";


    document.getElementById("modalSource").textContent =
      listing.source ||
      "Unknown";


    document.getElementById("modalChecked").textContent =
      formatDate(
        listing.last_checked ||
        listing.updated_at ||
        listing.created_at
      );


    const link =
      listing.listing_url ||
      listing.url ||
      "#";


    const modalLink =
      document.getElementById("modalLink");

    modalLink.href = link;


    if (link === "#") {

      modalLink.style.display = "none";

    } else {

      modalLink.style.display = "block";

    }


    const image =
      listing.image_url ||
      listing.image ||
      "";


    const modalImage =
      document.getElementById("modalImage");


    if (image) {

      modalImage.innerHTML = `
        <img
          class="modal-image"
          src="${escapeHTML(image)}"
          alt="${escapeHTML(listing.title || "")}"
        >
      `;

    } else {

      modalImage.innerHTML = `
        <div class="no-image">
          🚗
        </div>
      `;

    }


    document
      .getElementById("modal")
      .classList.add("show");

  };


  /* =========================================================
     CLOSE MODAL
     ========================================================= */

  window.closeModal = function() {

    document
      .getElementById("modal")
      .classList.remove("show");

  };


  document
    .getElementById("modal")
    .addEventListener(
      "click",
      function(event) {

        if (event.target === this) {
          closeModal();
        }

      }
    );


  document.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Escape") {
        closeModal();
      }

    }
  );


  /* =========================================================
     DATE
     ========================================================= */

  function formatDate(value) {

    if (!value) {
      return "Not available";
    }

    const date =
      new Date(value);

    if (Number.isNaN(date.getTime())) {
      return "Not available";
    }

    return date.toLocaleString(
      "en-NZ",
      {
        dateStyle: "medium",
        timeStyle: "short"
      }
    );

  }


  /* =========================================================
     TRADE ME SEARCH
     ========================================================= */

  window.openTradeMe = function() {

    const query =
      document
        .getElementById("searchInput")
        .value
        .trim();


    const url =
      "https://www.trademe.co.nz/a/motors/cars/search?search_string=" +
      encodeURIComponent(query);


    window.open(
      url,
      "_blank"
    );

  };


  /* =========================================================
     FACEBOOK MARKETPLACE SEARCH
     ========================================================= */

  window.openFacebook = function() {

    const query =
      document
        .getElementById("searchInput")
        .value
        .trim();


    const url =
      "https://www.facebook.com/marketplace/search/?query=" +
      encodeURIComponent(query);


    window.open(
      url,
      "_blank"
    );

  };


  /* =========================================================
     ENTER KEY SEARCH
     ========================================================= */

  document
    .getElementById("searchInput")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          applyFilters();
        }

      }
    );


  document
    .getElementById("maxPrice")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          applyFilters();
        }

      }
    );


  /* =========================================================
     START APP
     ========================================================= */

  updateSavedCount();

  loadListings();

</script>

</body>
</html>
