<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DealFinder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header span {
      color: #22c55e;
    }

    .hero {
      max-width: 1100px;
      margin: 25px auto;
      padding: 40px 25px;
      border-radius: 20px;
      color: white;
      background: linear-gradient(135deg, #111827, #2563eb);
    }

    .hero h2 {
      font-size: 42px;
      margin: 0 0 10px;
    }

    .hero p {
      font-size: 18px;
    }

    .search-box {
      max-width: 1100px;
      margin: 20px auto;
      padding: 18px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px #0001;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 10px;
    }

    input,
    select,
    button {
      padding: 13px;
      border-radius: 9px;
      font-size: 16px;
    }

    input,
    select {
      border: 1px solid #ccd2dc;
    }

    button {
      cursor: pointer;
    }

    .search-button {
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    .sources {
      max-width: 1100px;
      margin: 20px auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .source-button {
      border: none;
      color: white;
      font-weight: bold;
      padding: 18px;
      border-radius: 14px;
      font-size: 17px;
    }

    .trademe {
      background: #e53935;
    }

    .facebook {
      background: #1877f2;
    }

    .source-icon {
      font-size: 25px;
      vertical-align: middle;
      margin-right: 8px;
    }

    .results {
      max-width: 1100px;
      margin: 30px auto;
    }

    .results h2 {
      margin-bottom: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px #0001;
    }

    .image {
      height: 190px;
      background: linear-gradient(135deg, #dbeafe, #e5e7eb);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 75px;
    }

    .content {
      padding: 17px;
    }

    .content h3 {
      margin: 0 0 8px;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      color: #16a34a;
      margin: 10px 0;
    }

    .details {
      color: #64748b;
      line-height: 1.6;
    }

    .deal {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 10px;
      border-radius: 20px;
      background: #dcfce7;
      color: #166534;
      font-weight: bold;
      font-size: 13px;
    }

    .save {
      float: right;
      border: none;
      background: #eef2ff;
      padding: 8px 12px;
    }

    .listing-button {
      display: block;
      margin-top: 15px;
      padding: 11px;
      text-align: center;
      text-decoration: none;
      background: #111827;
      color: white;
      border-radius: 8px;
      font-weight: bold;
    }

    .ai-box {
      max-width: 1100px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px #0001;
    }

    .ai-box h3 {
      margin-top: 0;
    }

    .ai-status {
      color: #2563eb;
      font-weight: bold;
    }

    @media (max-width: 800px) {
      .search-box {
        grid-template-columns: 1fr;
        margin: 15px;
      }

      .sources {
        grid-template-columns: 1fr;
        margin: 15px;
      }

      .hero,
      .results,
      .ai-box {
        margin-left: 15px;
        margin-right: 15px;
      }

      .hero h2 {
        font-size: 34px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Deal<span>Finder</span></h1>
</header>

<section class="hero">
  <h2>Find the deals.</h2>
  <p>
    Search cars, motorbikes and parts and let DealFinder
    help you find listings worth checking out.
  </p>
</section>

<section class="search-box">

  <input
    id="search"
    type="text"
    placeholder="Try: S13 manual RWD"
  >

  <select id="category">
    <option value="all">Everything</option>
    <option value="Cars">Cars</option>
    <option value="Motorbikes">Motorbikes</option>
    <option value="Parts">Parts</option>
  </select>

  <input
    id="maxPrice"
    type="number"
    placeholder="Max NZ$"
  >

  <button
    class="search-button"
    onclick="searchDeals()"
  >
    🔎 Search
  </button>

</section>

<section class="sources">

  <button
    class="source-button trademe"
    onclick="openTradeMe()"
  >
    <span class="source-icon">🔴</span>
    Search Trade Me
  </button>

  <button
    class="source-button facebook"
    onclick="openFacebook()"
  >
    <span class="source-icon">ⓕ</span>
    Search Facebook Marketplace
  </button>

</section>

<section class="ai-box">

  <h3>🤖 DealFinder AI</h3>

  <p>
    Describe what you're looking for and DealFinder will
    match it against the listings currently available in the app.
  </p>

  <p class="ai-status" id="aiStatus">
    Ready to find deals.
  </p>

</section>

<section class="results">

  <h2 id="resultTitle">
    Latest Deals
  </h2>

  <div
    class="grid"
    id="listings"
  ></div>

</section>

<script>

const listings = [

  {
    name: "Nissan Silvia S13",
    price: 8500,
    category: "Cars",
    location: "Gisborne",
    details: "Manual • RWD • Project car",
    icon: "🚗",
    deal: "Potential deal"
  },

  {
    name: "Mazda MX-5 NA",
    price: 9500,
    category: "Cars",
    location: "Napier",
    details: "Manual • RWD • Convertible",
    icon: "🏎️",
    deal: "Good price"
  },

  {
    name: "Toyota Altezza",
    price: 7800,
    category: "Cars",
    location: "Hamilton",
    details: "Manual • RWD • Sedan",
    icon: "🚘",
    deal: "Potential deal"
  },

  {
    name: "Honda CBR125R",
    price: 3200,
    category: "Motorbikes",
    location: "Auckland",
    details: "Manual • Sport bike",
    icon: "🏍️",
    deal: "Good price"
  },

  {
    name: "Yamaha MT-125",
    price: 5200,
    category: "Motorbikes",
    location: "Tauranga",
    details: "Manual • Naked bike",
    icon: "🏍️",
    deal: "Potential deal"
  },

  {
    name: "SR20DET Engine",
    price: 4500,
    category: "Parts",
    location: "Wellington",
    details: "Turbo • SR20 • Engine",
    icon: "⚙️",
    deal: "Good price"
  }

];

function showListings(items) {

  const container =
    document.getElementById("listings");

  document.getElementById("resultTitle").textContent =
    items.length +
    " Deal" +
    (items.length === 1 ? "" : "s");

  container.innerHTML = "";

  if (items.length === 0) {

    container.innerHTML = `
      <div>
        <h3>No deals found.</h3>
        <p>Try changing your search.</p>
      </div>
    `;

    return;
  }

  items.forEach(item => {

    container.innerHTML += `

      <article class="card">

        <div class="image">
          ${item.icon}
        </div>

        <div class="content">

          <button
            class="save"
            onclick="toggleSave(this)"
          >
            ♡
          </button>

          <h3>${item.name}</h3>

          <div class="price">
            NZ$${item.price.toLocaleString()}
          </div>

          <div class="details">
            📍 ${item.location}<br>
            ${item.details}
          </div>

          <span class="deal">
            ${item.deal}
          </span>

        </div>

      </article>

    `;

  });

}

function toggleSave(button) {

  button.textContent =
    button.textContent === "♡" ? "♥" : "♡";

}

function searchDeals() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const category =
    document.getElementById("category").value;

  const maxPrice =
    Number(
      document.getElementById("maxPrice").value
    ) || Infinity;

  document.getElementById("aiStatus").textContent =
    "🤖 DealFinder is matching your search...";

  const results = listings.filter(item => {

    const searchableText =
      (
        item.name +
        " " +
        item.details +
        " " +
        item.location
      ).toLowerCase();

    const matchesSearch =
      search === "" ||
      searchableText.includes(search) ||
      search
        .split(" ")
        .some(word =>
          word.length > 2 &&
          searchableText.includes(word)
        );

    const matchesCategory =
      category === "all" ||
      item.category === category;

    const matchesPrice =
      item.price <= maxPrice;

    return (
      matchesSearch &&
      matchesCategory &&
      matchesPrice
    );

  });

  showListings(results);

  setTimeout(() => {

    document.getElementById("aiStatus").textContent =
      "🤖 Found " +
      results.length +
      " matching deal" +
      (results.length === 1 ? "" : "s") +
      ".";

  }, 400);

}

function openTradeMe() {

  const search =
    document.getElementById("search").value.trim();

  const query =
    search || "cars";

  const url =
    "https://www.trademe.co.nz/a/motors/cars/search?search_string=" +
    encodeURIComponent(query);

  window.open(url, "_blank");

}

function openFacebook() {

  const search =
    document.getElementById("search").value.trim();

  const query =
    search || "cars";

  const url =
    "https://www.facebook.com/marketplace/search/?query=" +
    encodeURIComponent(query);

  window.open(url, "_blank");

}

showListings(listings);

</script>

</body>
</html>
