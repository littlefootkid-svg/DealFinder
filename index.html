<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DealFinder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header span {
      color: #22c55e;
    }

    .hero {
      max-width: 1100px;
      margin: 25px auto;
      padding: 40px 25px;
      border-radius: 20px;
      color: white;
      background: linear-gradient(135deg, #111827, #2563eb);
    }

    .hero h2 {
      font-size: 42px;
      margin: 0 0 10px;
    }

    .hero p {
      font-size: 18px;
    }

    .search-box {
      max-width: 1100px;
      margin: 20px auto;
      padding: 18px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px #0001;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 10px;
    }

    input,
    select,
    button {
      padding: 13px;
      border-radius: 9px;
      font-size: 16px;
    }

    input,
    select {
      border: 1px solid #ccd2dc;
    }

    .search-button {
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .sources {
      max-width: 1100px;
      margin: 20px auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .source-button {
      border: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
      padding: 16px;
      border-radius: 12px;
      font-size: 17px;
    }

    .trademe {
      background: #e53935;
    }

    .facebook {
      background: #1877f2;
    }

    .results {
      max-width: 1100px;
      margin: 30px auto;
    }

    .results h2 {
      margin-bottom: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px #0001;
    }

    .image {
      height: 180px;
      background: linear-gradient(135deg, #dbeafe, #e5e7eb);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 70px;
    }

    .content {
      padding: 17px;
    }

    .content h3 {
      margin: 0 0 8px;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      color: #16a34a;
      margin: 10px 0;
    }

    .details {
      color: #64748b;
      line-height: 1.6;
    }

    .deal {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 10px;
      border-radius: 20px;
      background: #dcfce7;
      color: #166534;
      font-weight: bold;
      font-size: 13px;
    }

    .save {
      float: right;
      border: none;
      background: #eef2ff;
      cursor: pointer;
    }

    .listing-button {
      display: block;
      margin-top: 15px;
      padding: 11px;
      text-align: center;
      text-decoration: none;
      background: #111827;
      color: white;
      border-radius: 8px;
      font-weight: bold;
    }

    @media (max-width: 800px) {
      .search-box {
        grid-template-columns: 1fr;
        margin: 15px;
      }

      .sources {
        grid-template-columns: 1fr;
        margin: 15px;
      }

      .hero,
      .results {
        margin-left: 15px;
        margin-right: 15px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }  </style>
</head>

<body>

<header>
  <h1>Deal<span>Finder</span></h1>
</header>

<section class="hero">
  <h2>Find the deals.</h2>

  <p>
    Search cars, motorbikes and parts and find listings
    that could be worth checking out.
  </p>
</section>

<section class="search-box">

  <input
    id="search"
    type="text"
    placeholder="Search e.g. S13, MX-5, CBR..."
  >

  <select id="category">
    <option value="all">Everything</option>
    <option value="Cars">Cars</option>
    <option value="Motorbikes">Motorbikes</option>
    <option value="Parts">Parts</option>
  </select>

  <input
    id="maxPrice"
    type="number"
    placeholder="Max NZ$"
  >

  <button
    class="search-button"
    onclick="searchDeals()"
  >
    Search
  </button>

</section>

<section class="sources">

  <button
    class="source-button trademe"
    onclick="openTradeMe()"
  >
    🔴 Search Trade Me
  </button>

  <button
    class="source-button facebook"
    onclick="openFacebook()"
  >
    🔵 Search Facebook Marketplace
  </button>

</section>

<section class="results">

  <h2 id="resultTitle">
    Latest Deals
  </h2>

  <div
    class="grid"
    id="listings"
  ></div>

</section>https://didactic-waffle-jr7967g9qv7pc5vp6-8000.app.github.dev/
