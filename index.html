<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DealFinder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header span {
      color: #22c55e;
    }

    .hero {
      max-width: 1100px;
      margin: 25px auto;
      padding: 40px 25px;
      border-radius: 20px;
      color: white;
      background: linear-gradient(135deg, #111827, #2563eb);
    }

    .hero h2 {
      font-size: 42px;
      margin: 0 0 10px;
    }

    .hero p {
      font-size: 18px;
      line-height: 1.5;
    }

    .search-box {
      max-width: 1100px;
      margin: 20px auto;
      padding: 18px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px #0001;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 10px;
    }

    input,
    select,
    button {
      padding: 13px;
      border-radius: 9px;
      font-size: 16px;
    }

    input,
    select {
      border: 1px solid #ccd2dc;
      background: white;
    }

    button {
      cursor: pointer;
    }

    .search-button {
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    .source-buttons {
      max-width: 1100px;
      margin: 20px auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .source-button {
      border: none;
      color: white;
      font-weight: bold;
      min-height: 60px;
      font-size: 17px;
    }

    .trade-button {
      background: #e53935;
    }

    .facebook-button {
      background: #1877f2;
    }

    .results {
      max-width: 1100px;
      margin: 30px auto;
    }

    .status {
      margin-bottom: 20px;
      padding: 15px;
      background: white;
      border-radius: 12px;
      color: #475569;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px #0001;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 22px #0002;
    }

    .image {
      height: 190px;
      background: linear-gradient(135deg, #dbeafe, #e5e7eb);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 65px;
      overflow: hidden;
    }

    .image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .content {
      padding: 17px;
    }

    .content h3 {
      margin: 0 0 8px;
      padding-right: 45px;
    }

    .description {
      color: #475569;
      line-height: 1.5;
      margin: 12px 0;
      font-size: 14px;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      color: #16a34a;
      margin: 10px 0;
    }

    .details {
      color: #64748b;
      line-height: 1.6;
    }

    .deal {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 10px;
      border-radius: 20px;
      background: #dcfce7;
      color: #166534;
      font-weight: bold;
      font-size: 13px;
    }

    .source {
      display: inline-block;
      margin-top: 8px;
      margin-left: 5px;
      padding: 6px 10px;
      border-radius: 20px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 13px;
      font-weight: bold;
    }

    .save {
      float: right;
      border: none;
      background: #eef2ff;
      cursor: pointer;
      font-size: 22px;
      padding: 8px 11px;
    }

    .tap-text {
      margin-top: 15px;
      color: #2563eb;
      font-weight: bold;
    }

    .empty {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
    }

    @media (max-width: 800px) {

      .search-box {
        grid-template-columns: 1fr;
        margin: 15px;
      }

      .source-buttons {
        grid-template-columns: 1fr;
        margin: 15px;
      }

      .hero,
      .results {
        margin-left: 15px;
        margin-right: 15px;
      }

      .hero h2 {
        font-size: 34px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Deal<span>Finder</span></h1>
</header>


<section class="hero">

  <h2>Find the deals.</h2>

  <p>
    Search cars, motorbikes and parts and let
    DealFinder find listings worth checking out.
  </p>

</section>


<section class="search-box">

  <input
    id="search"
    type="text"
    placeholder="Try: S13 manual RWD"
  >

  <select id="category">

    <option value="all">Everything</option>
    <option value="Cars">Cars</option>
    <option value="Motorbikes">Motorbikes</option>
    <option value="Parts">Parts</option>

  </select>


  <input
    id="maxPrice"
    type="number"
    placeholder="Max NZ$"
  >


  <button
    class="search-button"
    onclick="searchDeals()"
  >
    🔎 Search
  </button>

</section>


<section class="source-buttons">

  <button
    class="source-button trade-button"
    onclick="searchTradeMe()"
  >
    🟠 Search Trade Me
  </button>


  <button
    class="source-button facebook-button"
    onclick="searchFacebook()"
  >
    f&nbsp;&nbsp; Search Facebook Marketplace
  </button>

</section>


<section class="results">

  <div
    class="status"
    id="status"
  >
    🔄 Loading DealFinder...
  </div>


  <h2 id="resultTitle">
    Loading deals...
  </h2>


  <div
    class="grid"
    id="listings"
  ></div>

</section>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================
   SUPABASE INITIALIZATION
===================================== */

const SUPABASE_URL =
  "https://lsjhxztfvxnukennnvgq.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_sYotvwrOC6DYp7KLPjV4jw__JAmPqU1";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let listings = [];


/* =====================================
   DUMMY LISTINGS
===================================== */

const dummyListings = [

  {
    title: "Nissan Silvia S13",
    price: 8500,
    category: "Cars",
    location: "Gisborne",
    details: "Manual • RWD • Project car",
    description:
      "A lightweight rear-wheel-drive Nissan Silvia S13 project car. The manual gearbox and RWD layout make it an interesting starting point for a project build. Check the body, engine, rust, WOF and registration before buying.",
    source: "Trade Me",
    image_url: "",
    listing_url: "#"
  },


  {
    title: "Mazda MX-5 NA",
    price: 9500,
    category: "Cars",
    location: "Napier",
    details: "Manual • RWD • Convertible",
    description:
      "Classic Mazda MX-5 NA with a manual gearbox, rear-wheel drive and convertible body. A fun lightweight sports car with plenty of aftermarket support.",
    source: "Facebook Marketplace",
    image_url: "",
    listing_url: "#"
  },


  {
    title: "Toyota Altezza",
    price: 7800,
    category: "Cars",
    location: "Hamilton",
    details: "Manual • RWD • Sedan",
    description:
      "Toyota Altezza sedan with rear-wheel drive and a manual transmission. A practical-looking platform that can also be used as a project or enthusiast car.",
    source: "Trade Me",
    image_url: "",
    listing_url: "#"
  },


  {
    title: "Honda CBR125R",
    price: 3200,
    category: "Motorbikes",
    location: "Auckland",
    details: "Manual • Sport bike • 125cc",
    description:
      "Small-displacement Honda sport bike with a manual gearbox. The CBR125R has the styling of a larger sport bike while using a smaller engine.",
    source: "Facebook Marketplace",
    image_url: "",
    listing_url: "#"
  },


  {
    title: "Yamaha MT-125",
    price: 5200,
    category: "Motorbikes",
    location: "Tauranga",
    details: "Manual • Naked bike • 125cc",
    description:
      "Yamaha's compact MT-series naked bike. A lightweight motorcycle with upright styling and a manual transmission.",
    source: "Trade Me",
    image_url: "",
    listing_url: "#"
  },


  {
    title: "SR20DET Engine",
    price: 4500,
    category: "Parts",
    location: "Wellington",
    details: "Turbo • SR20 • Engine",
    description:
      "SR20DET turbocharged engine listed as a project component. The SR20 platform is commonly associated with Nissan performance builds. Check compression, condition, included parts and engine history before buying.",
    source: "Facebook Marketplace",
    image_url: "",
    listing_url: "#"
  }

];


/* =====================================
   LOAD LISTINGS
===================================== */

async function loadListings() {

  const status =
    document.getElementById("status");


  status.textContent =
    "🔄 Loading listings from Supabase...";


  const { data, error } =
    await supabaseClient
      .from("listings")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    status.textContent =
      "⚠️ Using DealFinder demo listings.";

    listings = dummyListings;

    showListings(listings);

    return;
  }


  /*
    If Supabase has listings, use them.
    If it is empty, show the dummy listings.
  */

  if (data && data.length > 0) {

    listings = data;

    status.textContent =
      "🟢 DealFinder database connected.";

  } else {

    listings = dummyListings;

    status.textContent =
      "🟢 Supabase connected • Demo listings loaded.";

  }


  showListings(listings);
}


/* =====================================
   SHOW LISTINGS
===================================== */

function showListings(items) {

  const container =
    document.getElementById("listings");


  const title =
    document.getElementById("resultTitle");


  title.textContent =
    items.length +
    " Deal" +
    (items.length === 1 ? "" : "s");


  container.innerHTML = "";


  if (items.length === 0) {

    container.innerHTML = `

      <div class="empty">

        <h3>
          No deals found.
        </h3>

        <p>
          Try changing your search.
        </p>

      </div>

    `;

    return;
  }


  items.forEach(
    (item, index) => {

      const imageHTML =
        item.image_url

          ? `

            <img
              src="${escapeHTML(item.image_url)}"
              alt="${escapeHTML(item.title)}"
            >

          `

          : getIcon(item.category);


      const price =
        item.price != null

          ? "NZ$" +
            Number(item.price)
              .toLocaleString()

          : "Price unavailable";


      const location =
        item.location ||
        "Location unavailable";


      const details =
        item.details ||
        "No details available";


      const description =
        item.description ||
        "No description available.";


      const source =
        item.source ||
        "DealFinder";


      const deal =
        getDealLabel(item.price);


      container.innerHTML += `

        <article
          class="card"
          onclick="openListing(${index})"
          style="cursor:pointer"
        >

          <div class="image">

            ${imageHTML}

          </div>


          <div class="content">

            <button
              class="save"
              onclick="
                event.stopPropagation();
                toggleSave(this);
              "
            >
              ♡
            </button>


            <h3>
              ${escapeHTML(item.title)}
            </h3>


            <div class="price">
              ${price}
            </div>


            <div class="details">

              📍
              ${escapeHTML(location)}

              <br>

              ${escapeHTML(details)}

            </div>


            <div class="description">

              ${escapeHTML(description)}

            </div>


            <span class="deal">
              ${deal}
            </span>


            <span class="source">
              ${escapeHTML(source)}
            </span>


            <div class="tap-text">
              Tap to view full listing →
            </div>

          </div>

        </article>

      `;

    }
  );
}


/* =====================================
   OPEN LISTING
===================================== */

function openListing(index) {

  const item =
    listings[index];


  if (!item) {
    return;
  }


  const price =
    item.price != null

      ? "NZ$" +
        Number(item.price)
          .toLocaleString()

      : "Price unavailable";


  const imageHTML =
    item.image_url

      ? `

        <img
          src="${escapeHTML(item.image_url)}"
          alt="${escapeHTML(item.title)}"
          style="
            width:100%;
            max-height:300px;
            object-fit:cover;
            border-radius:15px;
          "
        >

      `

      : `

        <div
          style="
            height:220px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:90px;
            background:#e5e7eb;
            border-radius:15px;
          "
        >

          ${getIcon(item.category)}

        </div>

      `;


  const location =
    item.location ||
    "Unknown location";


  const details =
    item.details ||
    "No extra details available.";


  const description =
    item.description ||
    "No description available.";


  const source =
    item.source ||
    "Unknown source";


  const category =
    item.category ||
    "Unknown category";


  const deal =
    getDealLabel(item.price);


  const modal =
    document.createElement("div");


  modal.id =
    "listingModal";


  modal.style.cssText = `

    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:9999;

  `;


  modal.innerHTML = `

    <div
      style="
        background:white;
        width:100%;
        max-width:650px;
        max-height:90vh;
        overflow:auto;
        border-radius:20px;
        padding:20px;
        position:relative;
      "
    >


      <button
        onclick="closeListing()"
        style="
          position:absolute;
          right:15px;
          top:15px;
          border:none;
          background:#eef2f7;
          border-radius:50%;
          width:40px;
          height:40px;
          font-size:22px;
          z-index:2;
        "
      >
        ×
      </button>


      ${imageHTML}


      <h2>
        ${escapeHTML(item.title)}
      </h2>


      <div
        style="
          font-size:28px;
          font-weight:bold;
          color:#16a34a;
          margin:10px 0;
        "
      >

        ${price}

      </div>


      <p>

        📍
        <strong>
          Location:
        </strong>

        ${escapeHTML(location)}

      </p>


      <p>

        🏷️
        <strong>
          Source:
        </strong>

        ${escapeHTML(source)}

      </p>


      <p>

        🚘
        <strong>
          Category:
        </strong>

        ${escapeHTML(category)}

      </p>


      <hr>


      <h3>
        Description
      </h3>


      <p
        style="
          line-height:1.7;
          color:#475569;
        "
      >

        ${escapeHTML(description)}

      </p>


      <h3>
        Vehicle details
      </h3>


      <p
        style="
          line-height:1.7;
          color:#475569;
        "
      >

        ${escapeHTML(details)}

      </p>


      <h3>
        🤖 DealFinder analysis
      </h3>


      <div
        style="
          background:#eff6ff;
          padding:15px;
          border-radius:12px;
          color:#1e40af;
        "
      >

        <strong>
          ${deal}
        </strong>

        <br><br>

        DealFinder has identified this
        listing as something worth
        checking based on its price,
        category and search details.

      </div>


      ${
        item.listing_url &&
        item.listing_url !== "#"

          ? `

            <button
              onclick="
                window.open(
                  '${escapeJS(item.listing_url)}',
                  '_blank'
                )
              "
              style="
                width:100%;
                margin-top:20px;
                background:#111827;
                color:white;
                border:none;
                font-weight:bold;
              "
            >

              View original listing →

            </button>

          `

          : `

            <button
              disabled
              style="
                width:100%;
                margin-top:20px;
                background:#cbd5e1;
                color:#475569;
                border:none;
                font-weight:bold;
                cursor:not-allowed;
              "
            >

              Original listing link
              coming soon

            </button>

          `
      }

    </div>

  `;


  document.body.appendChild(modal);
}


/* =====================================
   CLOSE LISTING
===================================== */

function closeListing() {

  const modal =
    document.getElementById(
      "listingModal"
    );


  if (modal) {
    modal.remove();
  }
}


/* =====================================
   SEARCH
===================================== */

function searchDeals() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const category =
    document
      .getElementById("category")
      .value;


  const maxPrice =
    Number(
      document
        .getElementById("maxPrice")
        .value
    ) || Infinity;


  const results =
    listings.filter(
      item => {

        const text =
          (
            (item.title || "") +
            " " +
            (item.details || "") +
            " " +
            (item.description || "") +
            " " +
            (item.location || "") +
            " " +
            (item.category || "")
          )
          .toLowerCase();


        const matchesSearch =
          search === "" ||
          text.includes(search);


        const matchesCategory =
          category === "all" ||
          item.category === category;


        const matchesPrice =
          item.price == null ||
          Number(item.price) <= maxPrice;


        return (
          matchesSearch &&
          matchesCategory &&
          matchesPrice
        );

      }
    );


  showListings(results);
}


/* =====================================
   TRADE ME SEARCH
===================================== */

function searchTradeMe() {

  const search =
    document
      .getElementById("search")
      .value
      .trim();


  const query =
    search || "cars";


  const url =
    "https://www.trademe.co.nz/a/motors/cars/search" +
    "?search_string=" +
    encodeURIComponent(query);


  window.open(
    url,
    "_blank"
  );
}


/* =====================================
   FACEBOOK SEARCH
===================================== */

function searchFacebook() {

  const search =
    document
      .getElementById("search")
      .value
      .trim();


  const query =
    search || "cars";


  const url =
    "https://www.facebook.com/marketplace/search/?query=" +
    encodeURIComponent(query);


  window.open(
    url,
    "_blank"
  );
}


/* =====================================
   SAVE BUTTON
===================================== */

function toggleSave(button) {

  if (
    button.textContent.trim()
    === "♡"
  ) {

    button.textContent = "♥";

    button.style.color =
      "#ef4444";

  } else {

    button.textContent = "♡";

    button.style.color = "";

  }
}


/* =====================================
   ICONS
===================================== */

function getIcon(category) {

  if (
    category === "Motorbikes"
  ) {

    return "🏍️";

  }


  if (
    category === "Parts"
  ) {

    return "⚙️";

  }


  return "🚗";
}


/* =====================================
   DEAL LABEL
===================================== */

function getDealLabel(price) {

  if (!price) {
    return "Check price";
  }


  if (
    Number(price) <= 5000
  ) {

    return "Good price";

  }


  if (
    Number(price) <= 10000
  ) {

    return "Potential deal";

  }


  return "Worth checking";
}


/* =====================================
   SECURITY HELPERS
===================================== */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeJS(value) {

  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "\\r");

}


/* =====================================
   START DEALFINDER
===================================== */

loadListings();

</script>


</body>
</html>
